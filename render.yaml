services:
  - type: web
    name: loglens-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///./backend/loglens.db
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: SAMPLE_DATA_DIR
        value: "./sample_data"
